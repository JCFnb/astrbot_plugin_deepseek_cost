<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型价格参考</title>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef4ff;
    --ink: #14213d;
    --muted: #6f7f99;
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.78);
    --line: rgba(255,255,255,.72);
    --line-soft: rgba(120,145,190,.16);
    --accent: #4776f6;
    --cyan: #05b8d4;
    --violet: #8b5cf6;
    --amber: #f59e0b;
    --green: #0f9f78;
    --shadow: 0 20px 55px rgba(48,80,145,.16);
    --shadow-sm: 0 8px 24px rgba(48,80,145,.10);
  }
  html[data-theme="dark"] {
    --bg: #070d18;
    --ink: #eaf1ff;
    --muted: #91a3bf;
    --glass: rgba(18,30,52,.58);
    --glass-strong: rgba(25,40,68,.84);
    --line: rgba(147,181,255,.16);
    --line-soft: rgba(147,181,255,.10);
    --shadow: 0 22px 64px rgba(0,0,0,.45);
    --shadow-sm: 0 8px 24px rgba(0,0,0,.28);
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      --bg: #070d18; --ink: #eaf1ff; --muted: #91a3bf;
      --glass: rgba(18,30,52,.58); --glass-strong: rgba(25,40,68,.84);
      --line: rgba(147,181,255,.16); --line-soft: rgba(147,181,255,.10);
      --shadow: 0 22px 64px rgba(0,0,0,.45); --shadow-sm: 0 8px 24px rgba(0,0,0,.28);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 30px 26px 40px;
    background-color: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .mesh { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
  .blob { position: absolute; border-radius: 50%; filter: blur(76px); opacity: .58; }
  .blob.a { width: 520px; height: 520px; left: -130px; top: -190px; background: radial-gradient(circle, #7ea5ff, transparent 68%); }
  .blob.b { width: 520px; height: 520px; right: -150px; top: 40px; background: radial-gradient(circle, #b994ff, transparent 68%); }
  .blob.c { width: 460px; height: 460px; left: 32%; bottom: -230px; background: radial-gradient(circle, #77e0e8, transparent 68%); }
  html[data-theme="dark"] .blob { opacity: .38; }

  .wrap { max-width: 1180px; margin: 0 auto; }
  .top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .mark {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    font-weight: 800; color: #fff; letter-spacing: -.05em;
    background: linear-gradient(145deg, var(--accent), var(--cyan));
    box-shadow: 0 12px 26px rgba(71,118,246,.34), inset 0 1px 0 rgba(255,255,255,.55);
  }
  h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
  .sub { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
  .back {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    color: var(--ink); font-size: 12px; padding: 9px 14px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow-sm);
    backdrop-filter: blur(18px); cursor: pointer;
  }
  .back:hover { background: var(--glass-strong); }
  .back span { color: var(--muted); }

  .hero {
    position: relative; overflow: hidden; padding: 22px 24px; margin-bottom: 18px;
    border-radius: 24px; border: 1px solid var(--line);
    background: linear-gradient(135deg, var(--glass-strong), var(--glass));
    box-shadow: var(--shadow); backdrop-filter: blur(26px) saturate(130%);
  }
  .hero::after {
    content: ""; position: absolute; width: 280px; height: 280px; right: -70px; top: -120px;
    background: radial-gradient(circle, rgba(71,118,246,.28), transparent 68%);
    pointer-events: none;
  }
  .hero h2 { margin: 0 0 6px; font-size: 16px; }
  .hero p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; max-width: 760px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 13px; }
  .chip {
    font-size: 10.5px; color: var(--muted); padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--line-soft); background: rgba(255,255,255,.22);
  }
  html[data-theme="dark"] .chip { background: rgba(140,180,255,.06); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(286px, 1fr)); gap: 14px; }
  .card {
    position: relative; overflow: hidden; padding: 17px;
    border-radius: 20px; border: 1px solid var(--line);
    background: linear-gradient(155deg, var(--glass-strong), var(--glass));
    box-shadow: var(--shadow-sm); backdrop-filter: blur(22px) saturate(125%);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: rgba(71,118,246,.40); }
  .card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
    opacity: .8;
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 9px; margin-bottom: 13px; }
  .model-name { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; word-break: break-all; }
  .badge {
    flex: none; font-size: 9.5px; padding: 4px 7px; border-radius: 999px;
    color: var(--accent); background: rgba(71,118,246,.12); border: 1px solid rgba(71,118,246,.18);
  }
  .badge.fixed { color: var(--green); background: rgba(15,159,120,.12); border-color: rgba(15,159,120,.18); }
  .rows { display: grid; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    padding: 8px 9px; border-radius: 10px;
    background: rgba(255,255,255,.20); border: 1px solid var(--line-soft);
  }
  html[data-theme="dark"] .row { background: rgba(140,180,255,.055); }
  .row .label { color: var(--muted); font-size: 11px; }
  .row .val { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row .val small { color: var(--muted); font-weight: 500; font-size: 9.5px; margin-left: 2px; }
  .split-label { display: flex; align-items: center; gap: 6px; margin: 11px 0 6px; color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .split-label::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .foot { margin-top: 12px; color: var(--muted); font-size: 10px; display: flex; justify-content: space-between; gap: 8px; }
  .empty, .err {
    padding: 18px; border-radius: 16px; color: var(--muted); font-size: 12px;
    background: var(--glass); border: 1px solid var(--line); text-align: center;
  }
  .err { display: none; color: #d9534f; border-color: rgba(217,83,79,.25); }
  .err.show { display: block; }
  .skeleton { height: 180px; border-radius: 20px; background: linear-gradient(100deg, var(--glass), var(--glass-strong), var(--glass)); background-size: 220% 100%; animation: shimmer 1.2s infinite; border: 1px solid var(--line); }
  @keyframes shimmer { to { background-position: -120% 0; } }
  @media (max-width: 620px) {
    body { padding: 18px 14px 28px; }
    .hero { padding: 18px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="mesh"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i></div>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="mark">¥</div>
      <div>
        <h1>模型价格参考</h1>
        <p class="sub">单位：人民币 / 百万 tokens · 本地估算口径</p>
      </div>
    </div>
    <a class="back" href="#" id="backBtn"><span>←</span> 返回用量仪表盘</a>
  </div>

  <div class="hero">
    <h2>参考价与估算说明</h2>
    <p>下表是插件内置的模型参考价，用于把 token 用量换算成估算费用。它不是实时报价，也不包含账号折扣、免费额度、阶梯价或服务商调价。</p>
    <div class="chips">
      <span class="chip">DeepSeek 区分高峰 / 空闲</span>
      <span class="chip">其他模型使用固定参考价</span>
      <span class="chip">实际扣费以服务商账单为准</span>
      <span class="chip" id="updatedChip">更新：—</span>
    </div>
  </div>

  <div class="err" id="err"></div>
  <div class="grid" id="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtPrice = (v) => {
  v = Number(v) || 0;
  if (v >= 100) return v.toFixed(0);
  if (v >= 1) return v.toFixed(2).replace(/\.00$/, '');
  return v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
};
const isDeepSeek = (name) => String(name || '').toLowerCase().includes('deepseek');

function applyTheme(isDark) { document.documentElement.dataset.theme = isDark ? 'dark' : 'light'; }

function goBack() {
  const parts = location.pathname.split('/');
  const i = parts.indexOf('models');
  if (i >= 0) {
    parts[i] = 'cost';
    location.href = parts.join('/') + location.search;
  } else {
    history.back();
  }
}

function priceRow(label, value) {
  return `<div class="row"><span class="label">${label}</span><span class="val">¥${fmtPrice(value)}<small>/1M</small></span></div>`;
}

function render(models) {
  if (!models.length) {
    $('grid').innerHTML = '<div class="empty">暂无价格配置</div>';
    return;
  }
  $('grid').innerHTML = models.map(m => {
    const deepseek = isDeepSeek(m.model);
    const peak = m.peak || {}, idle = m.idle || {};
    const fixed = deepseek && peak.cache === idle.cache && peak.miss === idle.miss && peak.out === idle.out;
    return `<article class="card">
      <div class="card-head">
        <div class="model-name">${esc(m.model)}</div>
        <span class="badge ${fixed ? 'fixed' : ''}">${fixed ? '固定参考价' : '分时参考价'}</span>
      </div>
      <div class="split-label">高峰 / 标准</div>
      <div class="rows">
        ${priceRow('缓存命中输入', peak.cache)}
        ${priceRow('缓存未命中输入', peak.miss)}
        ${priceRow('输出', peak.out)}
      </div>
      <div class="split-label">空闲 / 标准</div>
      <div class="rows">
        ${priceRow('缓存命中输入', idle.cache)}
        ${priceRow('缓存未命中输入', idle.miss)}
        ${priceRow('输出', idle.out)}
      </div>
      <div class="foot"><span>${esc(m.source || '参考价（估算）')}</span><span>CNY / 1M tokens</span></div>
    </article>`;
  }).join('');
}

async function main() {
  const err = $('err');
  try {
    const view = window.AstrBotPluginView;
    if (!view) throw new Error('页面桥接未加载，请刷新页面');
    await view.ready();
    const ctx = view.getContext && view.getContext();
    if (ctx) applyTheme(!!ctx.isDark);
    const d = await view.apiGet('/prices');
    if (d.updated) $('updatedChip').textContent = '更新：' + d.updated;
    render(d.models || []);
  } catch (e) {
    err.textContent = '加载失败：' + (e && e.message ? e.message : e);
    err.classList.add('show');
    $('grid').innerHTML = '';
  }
}

$('backBtn').addEventListener('click', (ev) => { ev.preventDefault(); goBack(); });

if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  applyTheme(mq.matches);
  mq.addEventListener && mq.addEventListener('change', e => applyTheme(e.matches));
}
main();
</script>
</body>
</html>
