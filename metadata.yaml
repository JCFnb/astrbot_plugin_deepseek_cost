name: astrbot_plugin_cost
display_name: DeepSeek 用量与费用
short_desc: 查看 AstrBot 的 DeepSeek API 用量与花费，私聊/群聊分列、对话排行榜与图表
desc: 仅针对 DeepSeek：基于本地 provider_stats 统计 token 用量，按官方价目表估算费用（区分高峰/空闲时段），支持按自然日查看单日用量（今天从 00:00 起算）、私聊/群聊拆分、对话排行榜、每日趋势、缓存命中率、模型明细和最近调用，并附带响应式 WebUI 仪表盘。
